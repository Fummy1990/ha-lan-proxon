# Proxon Zeitprogramm – Wochenübersicht + Bearbeitung je Tag
# Einfügen: Dashboard → Bearbeiten → Karte hinzufügen → „Manuell“ → YAML einfügen.
type: vertical-stack
cards:
  - type: entities
    title: Zeitprogramm Lüftung – Woche
    show_header_toggle: false
    entities:
      - entity: binary_sensor.proxon_fwt_zeitprogramm_luftung_aktiv
        name: Programm aktiv
      - entity: sensor.proxon_zeitprogramm_montag
        name: Montag
      - entity: sensor.proxon_zeitprogramm_dienstag
        name: Dienstag
      - entity: sensor.proxon_zeitprogramm_mittwoch
        name: Mittwoch
      - entity: sensor.proxon_zeitprogramm_donnerstag
        name: Donnerstag
      - entity: sensor.proxon_zeitprogramm_freitag
        name: Freitag
      - entity: sensor.proxon_zeitprogramm_samstag
        name: Samstag
      - entity: sensor.proxon_zeitprogramm_sonntag
        name: Sonntag
  - type: entities
    title: Montag
    show_header_toggle: false
    state_color: true
    entities:
